[package]
name = "nohrs-store"
description = "Persistence layer: SQLite (metadata/history) and redb (host KV) behind interface-segregated traits."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[lib]
name = "nohrs_store"
path = "src/nohrs_store.rs"
# The lib is a bench target by default, so `cargo bench` would run the unit
# tests through libtest, which rejects criterion's flags. The benchmarks live in
# `benches/`.
bench = false

[dependencies]
thiserror.workspace = true
tracing.workspace   = true
# `bundled` vendors SQLite (no OS dependency, stable docker/nix). `blob` enables
# incremental BLOB I/O (reserved for P3 content hashing). `trace` exposes the
# `profile` hook used by the diagnostics query logger. No tokio is pulled in.
rusqlite = { version = "0.40", features = ["bundled", "blob", "trace"] }
redb     = "4"

[dev-dependencies]
tempfile = "3"
criterion.workspace = true

# `harness = false` hands `main` to criterion instead of libtest.
[[bench]]
name = "store"
harness = false

[lints]
workspace = true
