[package]
name = "nohrs-launcher"
description = "Raycast-style floating launcher window for nohrs."
keywords = ["launcher", "gpui", "fuzzy", "search", "productivity"]
categories = ["gui"]
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[lib]
name = "nohrs_launcher"
path = "src/nohrs_launcher.rs"

[dependencies]
nohrs-core     = { path = "../nohrs-core" }
nohrs-services = { path = "../nohrs-services" }
nohrs-ui       = { path = "../nohrs-ui" }
gpui = "0.2"
gpui-component = "0.5"
# The fuzzy matcher behind the result ranking (docs/launcher.md §6). Only the
# matcher is needed: `nucleo` proper adds a worker pool and its own tick loop,
# which would duplicate GPUI's executor.
nucleo-matcher = "0.3"
anyhow.workspace  = true
tracing.workspace = true
global-hotkey = "0.8"

[dev-dependencies]
# `test-support` gates `TestAppContext` and the `#[gpui::test]` macro. It is a
# dev-dependency so the gpui test backend only links into the test build.
gpui = { version = "0.2", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
