[package]
name = "nohrs-cli"
description = "Command-line companion for nohrs: file operations that default to the trash."
keywords = ["cli", "rm", "trash", "filesystem", "undo"]
categories = ["command-line-utilities", "filesystem"]
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true

[lib]
name = "nohrs_cli"
path = "src/nohrs_cli.rs"

[[bin]]
# The crate keeps the `nohrs-*` family name; the command itself is short
# because it is typed constantly.
name = "noh"
path = "src/main.rs"

[dependencies]
nohrs-core = { path = "../nohrs-core" }
# The `gui` feature is deliberately off: the CLI needs only `fs::ops`, so it
# builds without any UI toolkit (it is part of `default-members`).
nohrs-services = { path = "../nohrs-services" }
clap.workspace = true
clap_complete.workspace = true
serde_json.workspace = true
dirs = "6"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
