name: Web

# The Rust CI ignores `web/**`; this is its mirror image, so a TypeScript
# change never waits on a Cargo build and vice versa (ADR 0006).
on:
  push:
    branches: [develop, main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  # The star count, the commit list and the release list are read at build
  # time, so the published site only follows the repository if it is rebuilt.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# The event is part of the group: a scheduled run's ref is the default branch,
# so without it an ordinary push to `develop` would cancel the Monday refresh
# and never deploy in its place.
concurrency:
  group: web-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Only a pull-request run is worth superseding. Cancelling a push, schedule
  # or dispatch run would kill the deploy job it contains — including between
  # the two wrangler steps — which the job's own `cancel-in-progress: false`
  # cannot prevent, because the cancellation happens at the run level.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: web

env:
  # Production is `main`. A scheduled run starts on the default branch, so it
  # has to say so explicitly; both jobs resolve this the same way, which is
  # what makes `needs: build` a check on the revision that actually ships.
  DEPLOY_REF: ${{ github.event_name == 'schedule' && 'main' || github.ref }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    # The exact revision this job validated. `deploy` checks that out rather
    # than the branch name, so a push landing between the two jobs cannot
    # publish a commit nothing has checked.
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.DEPLOY_REF }}
          # `npm ci` runs below, and a dependency lifecycle script must not be
          # able to read the checkout's persisted token.
          persist-credentials: false

      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # GITHUB_TOKEN only lifts the API rate limit. Without it the build falls
      # back to the committed snapshot rather than failing.
      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}

      - name: Check the prerendered output
        run: |
          test -f dist/client/en/index.html
          test -f dist/client/ja/index.html
          test -f dist/client/sitemap.xml
          test -f dist/client/en/blog/rss.xml
          test -d dist/client/_pagefind

      # Deploy publishes exactly this, rather than rebuilding: what shipped is
      # then the output these checks passed on, not a second build of it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist/client
          retention-days: 7
          include-hidden-files: true

  # A pull request gets the built site on a URL of its own, so a change can be
  # looked at before it is merged. This is a version *upload*, not a deploy:
  # `routes` lives on the deployment, so nothing published here can answer on
  # nohrs.app, and production keeps serving whatever `deploy` last shipped.
  preview:
    name: preview
    needs: build
    # Restricted to pull requests the repository owner opened, from a branch in
    # this repository. Two reasons, and the second is the binding one:
    #
    #   - A fork's `pull_request` run cannot read secrets, so it would fail at
    #     the upload rather than skip.
    #   - This job runs the *pull request's own copy* of this workflow file
    #     with a Cloudflare token. For anyone who cannot already push to this
    #     repository that is a deploy-access escalation, which is the same
    #     reason `deploy` below refuses to run off `main`.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login == 'syuya2036'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Its own environment so the credential can be narrowed later without
    # touching production: an environment secret shadows the repository one of
    # the same name. With nothing set there it falls through to the repository
    # secrets, so this works as configured today.
    environment: preview
    permissions:
      contents: read
      # To post the URL back on the pull request.
      pull-requests: write
    steps:
      # The commit `build` validated, for the same reason `deploy` does it:
      # `wrangler.jsonc` and the Workers have to match the assets.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # wrangler only; the site itself is downloaded, not rebuilt.
      - run: npm ci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist/client

      - name: Check the downloaded output
        run: |
          test -f dist/client/en/index.html
          test -f dist/client/ja/index.html
          test -d dist/client/_pagefind

      # An absent token reaches wrangler as an anonymous request, which fails on
      # authentication and says nothing about which secret is missing.
      - name: Check the Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not readable here. Add them to the 'preview' environment, or make them repository secrets."
            exit 1
          fi

      - name: Upload a preview version
        id: upload
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # wrangler writes a structured record of what it did here, so the URL
          # is read from a documented field rather than scraped out of the log.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The alias gives the pull request one address for its whole life:
          # pushing again replaces what that URL serves instead of minting a
          # new one, so a link posted in review does not go stale.
          npx wrangler versions upload --preview-alias "pr-${PR_NUMBER}"

          # `pipefail` is on by default here, so a missing file would fail the
          # step with jq's message rather than the one below.
          if [ ! -f "$WRANGLER_OUTPUT_FILE_PATH" ]; then
            echo "::error::wrangler wrote no output file, so the preview URL cannot be read."
            exit 1
          fi

          url="$(jq -r 'select(.type == "version-upload") | .preview_alias_url // empty' \
            "$WRANGLER_OUTPUT_FILE_PATH" | tail -1)"
          if [ -z "$url" ]; then
            # `versions upload` reads the Worker's current preview setting from
            # the API and prints nothing when it is off; it does not apply
            # `preview_urls` from wrangler.jsonc, which only `deploy` and
            # `triggers deploy` do. So the remedy is on the Worker, not here.
            echo "::error::The version uploaded, but the Worker has no preview URLs, so there is nothing to link to. Enable Preview URLs on nohrs-web (Cloudflare dashboard -> Workers & Pages -> nohrs-web -> Settings -> Domains & Routes), which also registers a workers.dev subdomain if the account has none. A deploy from main applies it too, since preview_urls is set in wrangler.jsonc."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      # One comment per pull request, rewritten on each push, rather than a new
      # one every time: the thread is for review, not for a build log.
      - name: Post the preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          URL: ${{ steps.upload.outputs.url }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          body="$(cat <<EOF
          <!-- web-preview -->
          **Web preview:** $URL

          Built from \`${SHA:0:7}\`. Uploaded as a version, so nohrs.app is untouched, and
          the URL is \`noindex\`. Pushing again replaces what it serves.
          EOF
          )"

          existing="$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            -q '.[] | select(.body | startswith("<!-- web-preview -->")) | .id' | head -1)"

          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$existing" -f "body=$body" --silent
          else
            gh api --method POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" -f "body=$body" --silent
          fi

  deploy:
    name: deploy
    needs: build
    # Production deploys only from `main`. A manual run on any other branch
    # would otherwise execute that branch's workflow and build scripts with the
    # production Cloudflare token, which is a push-access-to-deploy escalation.
    if: >-
      github.event_name == 'schedule'
      || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    # Keyed to the environment rather than the ref, so a scheduled run and a
    # push to `main` cannot deploy over each other. Not cancelled in flight:
    # a half-applied deploy is worse than a queued one.
    concurrency:
      group: web-deploy-production
      cancel-in-progress: false
    steps:
      # The commit `build` validated, not the branch it was on: `wrangler.jsonc`
      # and the Workers have to come from the same revision as the assets.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # wrangler only; the site itself is downloaded, not rebuilt.
      - run: npm ci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist/client

      - name: Check the downloaded output
        run: |
          test -f dist/client/en/index.html
          test -f dist/client/ja/index.html
          test -d dist/client/_pagefind

      - name: Deploy nohrs.app
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The comment reader needs a credential at request time, so unlike every
      # other value here it cannot be built into the assets. Pushed after the
      # deploy because `wrangler secret put` needs the script to exist, and on
      # every deploy because that is also how a rotated token reaches the edge.
      #
      # Removing the repository secret removes the credential from Cloudflare
      # too. Leaving it in place would mean a token someone deliberately
      # withdrew kept working until a human noticed.
      - name: Publish the Discussions token
        run: |
          if [ -n "$DISCUSSIONS_TOKEN" ]; then
            printf '%s' "$DISCUSSIONS_TOKEN" | npx wrangler secret put GITHUB_TOKEN
            exit 0
          fi

          echo "DISCUSSIONS_TOKEN is unset — withdrawing the Worker secret."
          # Asked for rather than suppressed: already absent is the state we
          # want, and anything else that goes wrong has to fail the deploy.
          # Swallowing a delete would report a credential as withdrawn while it
          # kept working at the edge.
          #
          # JSON is asked for so the name is quoted and the match can be an
          # exact one: a plain substring would also hit `OLD_GITHUB_TOKEN` and
          # then fail on deleting a secret that was never there. If the flag
          # ever goes away this fails loudly, which is the right direction for
          # a step that withdraws a credential.
          existing="$(npx wrangler secret list --format json)"
          if printf '%s' "$existing" | grep -q '"GITHUB_TOKEN"'; then
            npx wrangler secret delete GITHUB_TOKEN --force
          else
            echo "The Worker has no GITHUB_TOKEN secret; nothing to withdraw."
          fi
        env:
          DISCUSSIONS_TOKEN: ${{ secrets.DISCUSSIONS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the noh.rs redirect
        run: npx wrangler deploy --config workers/wrangler.noh-rs.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
