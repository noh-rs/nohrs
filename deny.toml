# cargo-deny configuration — licenses, advisories, dependency bans, sources.
# Mirrors docs/testing.md §3. The CI `deny` job runs `cargo deny check`.

[advisories]
# In CI, `bans`/`licenses`/`sources` are the required gate; `advisories` runs as
# an informational (non-blocking) step — see .github/workflows/ci.yml. The gpui
# async stack pulls several crates with open advisories that we cannot fix until
# upstream bumps; surfacing them without blocking matches testing.md's
# "informational early" stance.
#
# testing.md §3 lists `vulnerability = "deny"`, but this cargo-deny version
# removed the per-severity `vulnerability`/`notice` lint-level keys: advisories
# of those kinds are always errors now, so the setting is implied (and would be
# rejected as an unknown field if written out).
db-urls = ["https://github.com/RustSec/advisory-db"]
# Only flag unmaintained crates we depend on directly; transitive ones from the
# gpui stack are out of our control.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses only. Extend deliberately (a new entry means a new license
# is now allowed across the whole dependency tree).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  # NCSA (University of Illinois/NCSA): OSI-approved permissive license, reached
  # via gpui → image → ravif → rav1e → libfuzzer-sys.
  "NCSA",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
  # rustls unification — no OpenSSL in the tree.
  { name = "openssl-sys" },
  # testing.md §3 bans tokio outside the WASI plugin-execution layer
  # (nohrs-plugin-host, P4+), enforcing ADR 0004 / #64. tokio is still in the
  # tree transitively: gpui pulls a full async reqwest stack as a non-optional
  # dependency (gpui → gpui_http_client → zed-reqwest → hyper → h2 → tokio).
  # `wrappers` names every crate allowed to depend on tokio directly, which is
  # exactly that chain — so anything outside it, in particular a first-party
  # `nohrs-*` crate taking tokio back as a direct dependency, fails the check.
  #
  # Adding a crate here means admitting a new route to tokio, so each entry
  # needs a reason. Drop entries as gpui's HTTP stack sheds them; add
  # `nohrs-plugin-host` when the WASI layer lands in P4.
  #
  # `quinn` (zed-reqwest's QUIC transport) is a direct tokio parent in
  # Cargo.lock but resolves into no target's tree, so it is left out rather
  # than pre-approved. If a feature ever pulls it in, this check fails naming
  # quinn: add it here with its reason and re-run `cargo deny check bans`.
  { name = "tokio", wrappers = [
    "h2",            # gpui's HTTP/2 transport
    "hyper",         # gpui's HTTP client core
    "hyper-rustls",  # TLS for the above
    "hyper-util",    # connection pooling for the above
    "tokio-rustls",  # TLS stream adapter
    "tokio-socks",   # SOCKS proxy support in zed-reqwest
    "tokio-util",    # codec helpers for h2 / zed-reqwest
    "tower",         # zed-reqwest's middleware layer
    "zed-reqwest",   # gpui_http_client's HTTP client
  ] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
